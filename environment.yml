# Conda environment for IllposedLearning.
#
# Cross-platform (Windows / macOS Intel + Apple Silicon / Linux): only
# conda-forge is used, versions are pinned without build strings, and the
# pip-only packages ship Python 3.11 wheels for all of these platforms.
#
# Create:   conda env create -f environment.yml
# Update:   conda env update -f environment.yml --prune
# Activate: conda activate illposed
#
# Version constraints that matter:
#   - pysindy 1.7.x: Recover_Model.py passes feature_names to the SINDy
#     constructor and Basis.py subclasses BaseFeatureLibrary with the 1.7
#     fit/transform interface, both of which changed in pysindy 2.0.
#   - numpy 1.26: pysindy 1.7.5's FiniteDifference fails under numpy 2
#     (np.linalg.solve broadcasting change).
#   - setuptools < 81: pysindy 1.7.5 imports pkg_resources, removed in 81.
#   - libroadrunner 2.7.0: the last release built against numpy 1.26
#     (2.8+ require numpy~=2.2). numpy/scipy are repeated in the pip section
#     so pip cannot replace the conda builds while installing tellurium.
#   - OpenBLAS: on Windows conda-forge otherwise picks MKL 2026, which crashes
#     on any matrix product (0xC06D007F, mismatched tbb). OpenBLAS is also the
#     BLAS on Apple Silicon, so pinning it keeps numerics consistent everywhere.
#
# Optional extras, not installed here:
#   - scikit-learn-extra (KMedoids in Dependence/Functions.py and
#     Distance_test.ipynb). It is unmaintained, needs scikit-learn<1.3, and has
#     no Apple Silicon build for Python 3.11. Where needed (Windows, Linux,
#     Intel macOS), install it into a separate env with scikit-learn=1.2.
#   - torch: Multi.Regression_analysis_advanced uses it for GPU prescreening
#     when available and falls back to numpy otherwise.
name: illposed
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy=1.26.4
  - scipy=1.13.1
  - libblas=*=*openblas
  - pandas=2.2
  - matplotlib=3.9
  - scikit-learn=1.5
  - pysindy=1.7.5
  - setuptools<81
  - sympy=1.13
  - joblib=1.4
  - threadpoolctl=3.5
  - openpyxl=3.1          # Sample_Analysis reads/writes .xlsx trajectories
  - seaborn=0.13          # Functions.py, Collinearity / Distance_test notebooks
  - jupyterlab=4
  - ipykernel=6
  - pip
  - pip:
      - numpy==1.26.4
      - scipy==1.13.1
      - tellurium==2.2.10       # SBML models in Sample_Analysis.Trend_IC_time
      - libroadrunner==2.7.0
      - ordpy==1.1.5            # Jensen_Shannon.py
